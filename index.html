<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيفان - لاستيراد وتجارة البن الأخضر</title>
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121814;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
        }

        .profile-img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a3b899;
            margin-bottom: 15px;
            background-color: #fff;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
            color: #ffffff;
            font-weight: 700;
        }

        /* تنسيق الشعار (Slogan) */
        .slogan {
            font-size: 0.9rem;
            color: #4ade80;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* تنسيق العنوان البارز تحت الاسم */
        .header-address {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            text-align: right;
        }

        .header-address div {
            font-size: 0.85rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.5;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* الزر العام */
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
