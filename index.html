<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوزير ستور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #141412 0%, #070807 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 20, 18, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.1);
            padding-bottom: 28px;
        }

        .store-banner-box {
            width: 100%;
            height: 220px;
            background: #0d0d0c;
            position: relative;
            border-bottom: 3px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .store-banner {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #030303;
        }

        .content-area {
            padding: 0 20px;
            text-align: center;
            margin-top: -30px;
            position: relative;
            z-index: 2;
        }

        .profile-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 12px;
            background: #141412;
            border-radius: 50%;
            padding: 3px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #000;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .slogan {
            font-size: 0.88rem;
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-address {
            font-size: 0.83rem;
            color: #e2e8f0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
